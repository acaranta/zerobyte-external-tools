# Example deployment next to zerobyte (adapt names, paths and network).
# The image is published on Docker Hub; to build it yourself instead, replace
# `image:` with `build: .` in a clone of this repository.
services:
  zerobyte-external-tools:
    image: acaranta/zerobyte-external-tools:latest
    restart: unless-stopped
    environment:
      ZEROBYTE_URL: http://zerobyte:4096
      # Taken from the shell or a .env file next to this compose file.
      ZEROBYTE_API_KEY: ${ZEROBYTE_API_KEY:?set ZEROBYTE_API_KEY}
      MAX_CONCURRENT: "1"
      POLL_INTERVAL_SECONDS: "20"
      COOLDOWN_SECONDS: "60"
      TASK_TIMEOUT_HOURS: "12"
      # zerobyte (default) = import cron expressions from zerobyte, file = only schedules.yml
      SCHEDULE_SOURCE: zerobyte
      SCHEDULES_FILE: /config/schedules.yml
      # Must be the same time zone zerobyte runs in.
      TZ: Europe/Paris
      LOG_LEVEL: INFO
      # Queue, running backups and cool-downs survive restarts and upgrades.
      STATE_FILE: /state/state.json
      # Web interface on :8080 (and /healthz, which needs no key). Without
      # UI_API_KEY (16+ characters) only /healthz is served.
      UI_API_KEY: ${UI_API_KEY:?set UI_API_KEY}
      HEALTH_BIND: 0.0.0.0
    volumes:
      # Optional with SCHEDULE_SOURCE=zerobyte (overrides / exclusions only).
      - ./schedules.yml:/config/schedules.yml:ro
      # Writable even with read_only: true; owned by uid 10001 in the image.
      - zbtools-state:/state
    # Reach the interface through a reverse proxy on this network (preferably over
    # https, so the session cookie is Secure), or publish the port on a private address:
    # ports:
    #   - "127.0.0.1:8080:8080"
    networks:
      - zerobyte
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m

volumes:
  zbtools-state:

networks:
  # The network zerobyte is attached to, so that http://zerobyte:4096 resolves.
  zerobyte:
    external: true
