[project]
name = "zbtools"
version = "0.1.0"
description = "Companion tools for zerobyte: a backup scheduler with a bounded concurrency limit and a web UI to manage backups in bulk"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "croniter>=6.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[project.scripts]
zbtools = "zbtools.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zbtools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["zbtools", "fakes", "fake_server"]

# Always resolve and lock against public PyPI, whatever index the machine's own uv
# config points to, so uv.lock stays portable (CI, other hosts, contributors).
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
